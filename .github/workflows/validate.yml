name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit; bump deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate entries and index
        run: |
          python3 scripts/validate.py
          python3 scripts/build-index.py --check
      - name: Negative selftest (the validator still rejects every mutation)
        run: python3 scripts/selftest-negative.py
      - name: Packer selftest (local assets still pack deterministically)
        run: python3 scripts/selftest-package.py
